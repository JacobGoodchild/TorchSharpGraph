name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify:
        description: "Also run JetBrains' plugin checker against Rider 2026.1, 2026.2 and 2026.3 (large downloads)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: gradle/actions/setup-gradle@v4

      - name: C# library tests
        working-directory: dotnet
        run: dotnet test --configuration Release --logger "console;verbosity=normal"
      - name: Build the sample
        run: dotnet build samples/TorchSharpGraph.Samples --configuration Release
      - name: The sample saves PNG files when no viewer is listening
        run: |
          mkdir -p /tmp/png-check && cd /tmp/png-check
          dotnet "$GITHUB_WORKSPACE/samples/TorchSharpGraph.Samples/bin/Release/net8.0/TorchSharpGraph.Samples.dll" quick
          test "$(ls plots/*.png | wc -l)" -eq 7
      - name: Pack the NuGet package (not published)
        run: dotnet pack dotnet/src/TorchSharpGraph --configuration Release -o build/nuget

      - name: Plugin tests (including the sample talking to the plugin)
        env:
          TORCHSHARPGRAPH_SAMPLE_DLL: ${{ github.workspace }}/samples/TorchSharpGraph.Samples/bin/Release/net8.0/TorchSharpGraph.Samples.dll
        run: ./gradlew test --console=plain
      - name: Plugin zip
        run: ./gradlew buildPlugin --console=plain
      - name: The zip contains the plugin and its licence files
        run: |
          zip=$(ls build/distributions/torchsharpgraph-*.zip)
          unzip -l "$zip" | tee /tmp/zip.txt
          grep -q 'torchsharpgraph/lib/torchsharpgraph-' /tmp/zip.txt
          grep -q 'torchsharpgraph/licenses/LICENSE' /tmp/zip.txt
          grep -q 'torchsharpgraph/licenses/THIRD-PARTY-NOTICES.md' /tmp/zip.txt
      - uses: actions/upload-artifact@v4
        with:
          name: torchsharpgraph-plugin
          path: build/distributions/torchsharpgraph-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: torchsharpgraph-nuget
          path: build/nuget/*.nupkg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests
            dotnet/tests/**/TestResults

  # The Marketplace build: signed, Rider only, checked by JetBrains' plugin checker. Started by hand (Actions >
  # CI > Run workflow > verify). Secrets come from the repository's Settings > Secrets only; nothing is stored here.
  marketplace:
    if: github.event_name == 'workflow_dispatch' && inputs.verify
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space for three Rider downloads
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Signed Marketplace build and its signature check
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin verifyPluginSignature -PriderOnly=true --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: torchsharpgraph-marketplace
          path: build/distributions/*-signed.zip
      - name: Plugin checker against Rider 2026.1, 2026.2 and 2026.3
        run: ./gradlew verifyPlugin -PriderOnly=true --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
